
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cozy Pomodoro</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 8px;
  background: transparent;
  font-family: Georgia, serif;
}
.timer {
  width: 100%;
  padding: 14px 8px;
  text-align: center;
  color: #536b50;
  background: #f5f0e5;
  border: 1px solid #dce5d5;
  border-radius: 16px;
}
.modes, .controls {
  display: flex;
  justify-content: center;
  gap: 7px;
}
button {
  border: 0;
  border-radius: 10px;
  padding: 9px 12px;
  background: #e4e9dc;
  color: #536b50;
  font-family: inherit;
  cursor: pointer;
}
.active, #start {
  background: #8da58a;
  color: white;
}
#clock {
  font: bold 42px Arial, sans-serif;
  font-variant-numeric: tabular-nums;
  margin: 15px 0;
}
#status { font-size: 12px; margin-bottom: 12px; }
</style>
</head>
<body>
<div class="timer">
  <div class="modes">
    <button class="mode active" data-time="1500">Focus</button>
    <button class="mode" data-time="300">Short Break</button>
    <button class="mode" data-time="900">Long Break</button>
  </div>
  <div id="clock">25:00</div>
  <div id="status">Ready when you are 🌿</div>
  <div class="controls">
    <button id="start">▶ Start</button>
    <button id="reset">↺ Reset</button>
  </div>
</div>
<script>
let remaining = 1500, interval = null, running = false;
const clock = document.getElementById("clock");
const statusText = document.getElementById("status");
const start = document.getElementById("start");
const modes = document.querySelectorAll(".mode");

function display() {
  clock.textContent =
    String(Math.floor(remaining / 60)).padStart(2,"0") + ":" +
    String(remaining % 60).padStart(2,"0");
}
function pause() {
  clearInterval(interval);
  running = false;
  start.textContent = "▶ Start";
}
modes.forEach(button => button.addEventListener("click", () => {
  pause();
  remaining = Number(button.dataset.time);
  modes.forEach(m => m.classList.remove("active"));
  button.classList.add("active");
  statusText.textContent = "Ready when you are 🌿";
  display();
}));
start.addEventListener("click", () => {
  if (running) {
    pause();
    statusText.textContent = "Paused ☕";
    return;
  }
  running = true;
  start.textContent = "Ⅱ Pause";
  statusText.textContent = "One little step at a time 🌱";
  interval = setInterval(() => {
    remaining--;
    display();
    if (remaining <= 0) {
      pause();
      statusText.textContent = "Time for a little break 🌼";
    }
  }, 1000);
});
document.getElementById("reset").addEventListener("click", () => {
  pause();
  remaining = Number(document.querySelector(".mode.active").dataset.time);
  statusText.textContent = "Ready when you are 🌿";
  display();
});
display();
</script>
</body>
</html>
